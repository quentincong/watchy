# Watchy Configuration — non-sensitive settings (safe to commit).
# Sensitive credentials go in secrets.yaml (git-ignored).
#
# Deploy:
#   cp config.yaml ~/watchy_config/config.yaml
#   cp secrets.example.yaml ~/watchy_config/secrets.yaml
#   # then edit secrets.yaml with your real keys

# Tiered Tier 2 cadence (see tier2_days at the bottom of this file). Short-form
# entries run EVERY trading day; a long-form `tier2_days` puts a ticker on a
# lighter rotation. Rationale: one daily 4-analyst pipeline costs ~$9.6/yr per
# ticker regardless of position size — 1.1% of an $850 holding but 15% of a $63
# one — and 18 daily tickers pushed the batch past the 13:30 UTC market open.
# The weekly full-risk day (first trading session of the week) and any position
# already in the take-profit zone ALWAYS run, whatever is set here.
watchlist:
  # --- Daily: the largest positions, where the daily spend is clearly worth it.
  - "AVGO"
  - "TSM"
  - "GOOG"
  - "AMZN"
  - "VRT"
  - "NVDA"
  - "SKHY"        # smaller, but pinned daily by explicit request

  # --- Mon/Wed/Fri
  - ticker: "EMR"
    tier2_days: ["mon", "wed", "fri"]
  - ticker: "APH"
    tier2_days: ["mon", "wed", "fri"]
  - ticker: "NVT"
    tier2_days: ["mon", "wed", "fri"]

  # --- Tue/Thu
  - ticker: "ASML"
    tier2_days: ["tue", "thu"]
  - ticker: "VST"
    tier2_days: ["tue", "thu"]
  - ticker: "LUMN"
    tier2_days: ["tue", "thu"]

  # --- Watch-only (not held). Also still subject to the proximity gate below.
  # Dropped 2026-08-13 as thematically redundant with names already held:
  # MU (HBM -> SKHY), LRCX (semicap -> ASML), ETN (electrical -> EMR/APH/NVT).
  # Note the weekly full-risk day exempts every ticker from tier2_days, so a
  # watch-only name still costs ~$6/yr just by being listed — cadence can't be
  # lowered past that floor, only removal takes it to zero.
  - ticker: "COHR"
    tier2_days: ["mon", "thu"]
  - ticker: "CEG"
    tier2_days: ["wed"]

  # --- Added: AI infrastructure expansion

  # Ethernet / AI networking
  - ticker: "ANET"
    tier2_days: ["mon", "wed", "fri"]

  # Semiconductor process control / advanced packaging
  - ticker: "KLAC"
    tier2_days: ["tue", "thu"]

  # Custom silicon / interconnect / AI data-center
  - ticker: "MRVL"
    tier2_days: ["fri"]

  # AI infrastructure manufacturing / networking supply chain
  - ticker: "CLS"
    tier2_days: ["wed"]

  # - "ANET"
  # - "CARR"
  # - "MOD"
  # - "AAPL"
  # - "KLAC"
  # - "AMAT"
  # - "RMBS"
  # - "HUBB"
  # - "TSLA"
  # - "SOXX"
  # - "SMCI"

  
  # Short form uses defaults: scan every 30min, daily at 10:02 UTC, every day.
  # For per-ticker overrides, use the long form:
  # - ticker: "NVDA"
  #   tier1_interval_h: 2
  #   tier2_time_utc: "14:30"
  #   # Tiered cadence: which weekdays this ticker's Tier 2 runs on. Omit to
  #   # inherit the global tier2_days (which itself defaults to every day). The
  #   # weekly full-risk day and take-profit-zone positions ignore this.
  #   tier2_days: ["mon", "wed", "fri"]
  #   # Optional manual entry level (else the #16 auto-derived target is used).
  #   target_price: 180.0
  #   # Per-ticker override of the global Tier 2 gate (min_price_proximity_pct
  #   # below): e.g. set a huge percent to effectively never gate this name, or a
  #   # smaller one to gate it tighter than the default.
  #   min_price_proximity_pct: 8.0
  #   # Per-ticker ATR-adaptive band override (overrides the global mult below).
  #   atr_proximity_mult: 5.0
  #   # Per-ticker take-profit floor override (#28): arm this name's take-profit
  #   # zone at a different unrealized-gain % than the global take_profit floor.
  #   take_profit_floor_gain_pct: 15.0

# ---------------------------------------------------------------------------
# Watchy 2.0 — weekly plan + event-driven monitoring
# ---------------------------------------------------------------------------
# tier2_schedule:
#   weekly — (2.0) the full Tier 2 analysis runs ONLY on the first trading
#            session of each week and produces a validated, persisted weekly
#            plan per ticker; Tier 1 monitors that plan (no LLM) and routes
#            technical triggers. tier2_days / the proximity gate do not apply.
#   daily  — ROLLBACK to the exact 1.x behaviour: daily Tier 2 (tier2_days and
#            the proximity gate apply) and paid Tier 1 signal rescans
#            (max_tier1_pipelines_per_day). No database change is needed to
#            switch either way; restart the daemon after editing.
tier2_schedule: weekly

# Plan monitoring (Tier 1, deterministic, zero cost).
weekly_plan:
  approach_atr: 0.5            # within 0.5 ATR above the buy zone = "approaching"
  stale_move_atr: 0.5          # price moved > 0.5 ATR since an analysis → STALE — RECHECK REQUIRED
  renotify_h: 6                # don't repeat the same plan state within 6h (boundary flapping)
  market_data_max_age_min: 30  # older market data → stale, never actionable

# Paid Tier 1 analysis (Fast Recheck = advisor-only on the weekly digest;
# Triggered Risk = market+sentiment+news, bull/bear, simplified risk, advisor).
# enabled: false = SHADOW MODE — routes are computed, logged (route_log table,
# ROUTE journal lines) and mechanical reminders are sent, but no paid call is
# made. Weekly Full and the take-profit path are never limited by this budget.
# Budgets reset on the exchange trading-session boundary (New York date).
triggered_analysis:
  enabled: false
  max_per_ticker_per_trading_day: 1
  max_global_per_trading_day: 2
  bearish_shock_atr: 0.75      # session move <= -0.75 ATR = material negative move
  tickers: []                  # limited enablement allow-list; empty = all tickers

# Tier 2 price-proximity gate (#15) — global default applied to every watch-only
# (non-held) ticker. On weekdays, skip the daily LLM pipeline when price is farther
# than this percent from the entry target (manual target_price, else the #16
# auto-derived one). Held tickers and the weekly full-risk day (first trading
# session of the week) always run; Tier 1 is never gated.
# A per-ticker min_price_proximity_pct (long-form watchlist above) overrides this.
# Remove this line to disable the gate globally.
min_price_proximity_pct: 8.0

# Global default tiered cadence for Tier 2, applied to every ticker that doesn't
# set its own tier2_days. Leave commented out for "every trading day" — the
# historical behaviour. The per-ticker groups in the watchlist above are what
# actually shorten the batch, so this stays unset.
# tier2_days: ["mon", "tue", "wed", "thu", "fri"]

# Optional ATR-adaptive band (#15 follow-up). When set, the gate band becomes
# atr_proximity_mult x ATR% (ATR% = avg_atr_20d / price x 100) instead of the
# fixed percent above — i.e. "skip when price is more than `mult` typical trading
# days of movement from target". Volatile names get a wider band, calm names a
# narrower one. Clamped to [proximity_pct_floor, proximity_pct_ceiling]; falls
# back to the fixed percent when ATR data is unavailable. Leave commented to keep
# the fixed-percent behaviour. Calibrate the mult with
# scripts/calibrate_atr_proximity.py before enabling.
# Calibrated 2026-06-16 against the live watchlist: x3 skips ~9/21 (keeps cost
# savings) while no longer silencing volatile-but-near names (MOD, NVDA, ...).
atr_proximity_mult: 3.0
# proximity_pct_floor: 4.0
# proximity_pct_ceiling: 20.0

# Take-profit / anti-round-trip (#28) — ENABLED (live since 2026-07-23; set
# `enabled: false` to turn off). Protects unrealized gains on held winners so
# they don't round-trip. A held position whose unrealized gain crosses
# `floor_gain_pct` enters the take-profit
# zone: an explicit directive (gain, ATR runway to the analysts' upside, a
# reachable `price + mult x ATR` sell-limit) is injected into the advisor prompt,
# so it proposes banking a WHOLE-share tranche via a sell-limit (a new
# `Take-Profit:` advice line) instead of staying silent. Runs on the daily Tier 2
# advice for every held name in the zone, plus a Tier 1 intraday zone-entry
# trigger (advisor-only, reuses the last digest — no fresh pipeline) so the limit
# is set the same day. Advisory-only — you place the limit order (whole shares).
# floor_gain_pct is per-ticker overridable via take_profit_floor_gain_pct.
take_profit:
  enabled: true
  floor_gain_pct: 10.0      # arm the zone at this unrealized gain %
  limit_atr_mult: 1.5       # reachable sell-limit = price + mult x ATR
  stretch_atr_mult: 3.0     # higher "let it run" limit when runway is large
  runway_near_atr: 1.0      # < this many ATRs to the ceiling → bank most/all now
  runway_far_atr: 2.5       # > this → room to run, hold or take only a stretch share
  cooldown_h: 24            # intraday zone-entry trigger cooldown per ticker

# Tier 1 intraday rescan cap (#23). Each Tier 1 signal trip launches a paid
# [market+social] pipeline + advisor, guarded only by per-signal cooldown — so a
# busy ticker tripping several distinct signals stacks several paid rescans in a
# day (observed: KLAC x4, LRCX x3). Cap the number of Tier 1 LLM pipelines per
# ticker per UTC day; further trips are logged + notified (Signal Fired (rescan
# capped)) but skip the pipeline. A per-ticker max_tier1_pipelines_per_day in the
# long-form watchlist overrides this. Remove this line to disable the cap.
# Tier 2 scheduled runs are never affected.
#
# Lowered 2 -> 1 on 2026-08-21. A Tier 1 rescan is no longer the "half price"
# it was when the cap was introduced: measured on 2026-08-20 it costs 79% of a
# full Tier 2 run (CNY 0.453 vs 0.573). Dropping analysts only trims the flash
# side, while the pro pair (Research Manager + Portfolio Manager) runs on every
# pipeline and does not shrink -- COHR's rescan that day spent MORE on pro
# (CNY 0.263) than the same ticker's full Tier 2 run did (CNY 0.226). Tier 1 was
# 16% of that day's bill for 3 rescans.
max_tier1_pipelines_per_day: 1

# Thresholds & cooldowns below are OPTIONAL — defaults are in code.
# Uncomment any section to override.

# signal_thresholds:
#   rsi_oversold: 30
#   rsi_overbought: 70
#   volume_ratio_strong: 2.0
#   atr_ratio: 1.5

# cooldown:
#   rsi_extreme_h: 12
#   macd_cross_h: 24
#   bollinger_breach_h: 6
#   volume_anomaly_h: 4
#   atr_spike_h: 6
#   golden_cross_d: 7

log_level: "DEBUG"
log_file: "~/watchy/watchy.log"
